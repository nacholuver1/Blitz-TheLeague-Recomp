# Generated by ReXGlue v0.11.0.0-dev.unknown on 2026-11-20 23:18:19 UTC.

[project]
name = "blitz"
sdk_version = "0.11.0"
game_root = "../game"
hook_sources = ["src"]

[entrypoint]
file_path = "../game/default.xex"
out_directory_path = "generated/default"
includes = []

# CRT setjmp/longjmp, found by hand (see tools/find_calls.py, tools/xexdump/ppcdis.exe).
# jmp_buf: f14-f31 @0x00, r1 @0x90, r13-r31 @0x98, cr @0x130, lr @0x134
setjmp_address  = 0x82770D90
longjmp_address = 0x82770B40

# Console-exact vector math (fused multiply-add, dot products, estimates).
# The fast default rounds and handles denormals differently from Xenon; tried
# for the helmet-lift glitch (a helmet piece stays on the head, both D3D12 and
# Vulkan) and the mid-game audio loss.
[entrypoint.vector_math]
vmaddfp     = "exact"
vnmsubfp    = "exact"
vmsum3fp128 = "exact"
vmsum4fp128 = "exact"
vrefp       = "exact"
vrsqrtefp   = "exact"
vexptefp    = "exact"
fres        = "exact"
frsqrte     = "exact"

# Statically linked XAPILIB fiber routines -> SDK host-fiber shims.
# The guest SwitchToFiber (0x8242C560) swaps stacks mid-function, which native code can't do.
[entrypoint.shim]
ConvertThreadToFiber = 0x8242ABC8
ConvertFiberToThread = 0x8242AC58
CreateFiber          = 0x8242ACA8
DeleteFiber          = 0x8242AD88
SwitchToFiber        = 0x8242ADE8
